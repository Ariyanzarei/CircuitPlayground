<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KY-038 Mic Stream</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111;
         color: #eee; font-family: system-ui, sans-serif; text-align: center; }
  #speaker { width: 200px; height: 200px; cursor: pointer; background: none; border: 0; padding: 0; }
  #speaker svg { width: 100%; height: 100%; }
  .wave { fill: none; stroke: #ffaa33; stroke-width: 6; stroke-linecap: round; transition: opacity 60ms; }
  #status { color: #888; font-size: 14px; margin: 8px 0 20px; }
  label { font-size: 13px; color: #aaa; }
  #raw { font-size: 12px; color: #666; margin-top: 8px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div>
  <button id="speaker" title="Click to listen">
    <svg viewBox="0 0 100 100">
      <path d="M15 38 h15 l20 -18 v60 l-20 -18 h-15 z" fill="#eee"/>
      <line id="mute" x1="60" y1="35" x2="85" y2="65" stroke="#ff4050" stroke-width="6" stroke-linecap="round"/>
      <path class="wave" id="w1" d="M60 40 q8 10 0 20"/>
      <path class="wave" id="w2" d="M68 32 q14 18 0 36"/>
      <path class="wave" id="w3" d="M76 24 q20 26 0 52"/>
    </svg>
  </button>
  <div id="status">click the speaker to listen</div>
  <label>Gain <input id="gain" type="range" min="1" max="200" value="40"> <span id="gainVal">40×</span></label>
  <div id="raw">raw ADC: --</div>
</div>
<script>
const SAMPLE_RATE = 8000;
const JITTER = 0.15;          // seconds of audio buffered to absorb WiFi hiccups
let ctx = null, nextTime = 0, dc = 2048, level = 0, lastMsg = 0;

const $ = (id) => document.getElementById(id);
$("gain").oninput = () => ($("gainVal").textContent = $("gain").value + "×");

// Browsers only allow audio after a user click, so the speaker is a play/mute button.
$("speaker").onclick = async () => {
  if (!ctx) ctx = new AudioContext();
  ctx.state === "running" ? await ctx.suspend() : await ctx.resume();
  $("mute").style.display = ctx.state === "running" ? "none" : "";
};

new EventSource("/events").onmessage = (e) => {
  // base64 -> bytes -> 16-bit samples (raw ADC values 0..4095)
  const bytes = Uint8Array.from(atob(e.data), (c) => c.charCodeAt(0));
  const raw = new Uint16Array(bytes.buffer);
  lastMsg = performance.now();
  $("raw").textContent = `raw ADC: ${raw[0]}`;

  // Convert to audio: remove the DC offset (mic idles around mid-scale), amplify, clamp to -1..1
  const gain = +$("gain").value;
  const out = new Float32Array(raw.length);
  let sumSq = 0;
  for (let i = 0; i < raw.length; i++) {
    dc += (raw[i] - dc) * 0.001;              // slowly tracking average = the silence level
    const s = ((raw[i] - dc) / 2048) * gain;
    out[i] = Math.max(-1, Math.min(1, s));
    sumSq += out[i] * out[i];
  }
  level = Math.sqrt(sumSq / raw.length);      // loudness (RMS) for the animation

  if (!ctx || ctx.state !== "running") return;
  // Schedule this chunk right after the previous one, so chunks play gapless.
  const buf = ctx.createBuffer(1, out.length, SAMPLE_RATE);
  buf.copyToChannel(out, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  if (nextTime < now || nextTime > now + 1) nextTime = now + JITTER;  // (re)sync if we fell behind/ahead
  src.start(nextTime);
  nextTime += buf.duration;
};

// Light up the three sound waves according to loudness.
function frame() {
  const on = ctx && ctx.state === "running";
  [0.02, 0.08, 0.2].forEach((th, i) => ($("w" + (i + 1)).style.opacity = on && level > th ? 1 : 0.12));
  const age = performance.now() - lastMsg;
  $("status").textContent = lastMsg === 0 ? "waiting for data…"
    : age > 1000 ? "no data (ESP32 offline?)"
    : on ? "live" : "receiving: click the speaker to listen";
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
