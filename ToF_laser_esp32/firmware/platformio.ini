; PlatformIO project config: which board, which framework, which libraries.
[env:esp32dev]
platform = espressif32
board = esp32dev            ; generic ESP32 DevKit (ESP32-WROOM-32)
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X@^1.3.1   ; small, simple driver for the sensor
